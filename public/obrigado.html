<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><link rel="icon" href="/assets/favicon.ico" /><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" /><link rel="stylesheet" href="/css/style.css" /><title>Pedido confirmado</title><script src="/js/pixel.js"></script>
<!-- UTMify: pixel (ID do painel) + script de UTMs -->
<script>window.pixelId="6b0129f6a2e5630e45fa9e10";</script>
<script async defer src="https://cdn.utmify.com.br/scripts/pixel/pixel.js"></script>
<script src="https://cdn.utmify.com.br/scripts/utms/latest.js" data-utmify-prevent-xcod-sck data-utmify-prevent-subids async defer></script>

<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1125182217062286&ev=PageView&noscript=1" alt=""/></noscript>
</head>
<body class="bg-gray-50"><div class="max-w-md mx-auto min-h-screen p-6 flex flex-col items-center justify-center text-center">
  <div class="h-16 w-16 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-3xl mb-4">✓</div>
  <h1 class="text-xl font-extrabold mb-2">Seu pedido foi realizado com sucesso!</h1>
  <p class="text-sm text-gray-600 mb-6">Enviaremos a confirmação e o código de rastreio por e-mail e WhatsApp assim que o pedido for despachado.</p>
  <a href="/" class="rounded-full bg-red-600 text-white font-bold text-sm px-8 py-3">Voltar à loja</a>
</div><script src="/js/config.js"></script><script src="/js/common.js"></script>
<script>
// Purchase só dispara quando o Pix foi CONFIRMADO como pago (evita contar pedidos não pagos) e uma única vez.
(function () {
  const paid = store.get("paid");
  if (!paid || store.get("purchaseSent") === paid.ref) return;
  track("Purchase", { content_ids: [PRODUCT_ID], content_type: "product", num_items: paid.qty || 1, value: paid.total / 100, currency: "BRL" }, { eventID: "purchase-" + paid.ref });
  store.set("purchaseSent", paid.ref);
})();
</script></body></html>
